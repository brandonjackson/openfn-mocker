name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned pnpm version from package.json's "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # The conformance yardstick ratchet: fails if a verified route regressed,
      # a newly verified route is not recorded, or an accepted deviation went
      # stale. Offline and deterministic (specs come from the pinned
      # openfn-api-specs snapshot). See AGENTS.md "Conformance work order".
      - run: pnpm test:conformance -- --check-baseline
